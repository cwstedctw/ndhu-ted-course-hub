<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>W2 離堂證據卡 · 資訊科技與應用</title><style>*{box-sizing:border-box}body{background:#e7e9e8;color:#152e49;font-family:'Segoe UI','Microsoft JhengHei',sans-serif;line-height:1.55;margin:0}main{max-width:860px;margin:25px auto;background:#fffef9;padding:32px 44px}h1{font-size:32px;margin:8px 0 12px}h2{font-size:19px;border-bottom:2px solid #b66505;padding-bottom:5px;margin:22px 0 12px}p{margin:9px 0}.meta{display:grid;grid-template-columns:1fr 1fr;gap:20px}label{display:block;font-size:15px}input[type=text],input[type=url],textarea,select{display:block;width:100%;font:inherit;padding:7px 9px;border:1px solid #9aa6b0;background:#fff;min-height:36px;margin:5px 0 10px;color:#152e49}textarea{resize:vertical;min-height:55px}select{max-width:250px}.checks{display:flex;gap:20px;flex-wrap:wrap}.checks label{display:inline-flex;gap:7px}.hint{font-size:14px;color:#526071}.buttons{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}.buttons button,.buttons a{font:inherit;background:#152e49;color:white;border:0;padding:10px 15px;text-decoration:none;cursor:pointer}.buttons a{background:#e5e7e6;color:#152e49}#status{font-size:14px}@media(max-width:600px){main{margin:0;padding:23px}.meta{grid-template-columns:1fr;gap:0}h1{font-size:27px}}@media print{@page{size:A4;margin:12mm}body{background:white}main{margin:0;padding:0;max-width:none}h1{font-size:25px}h2{margin:14px 0 7px;font-size:17px}.hint{font-size:12px}label,p{font-size:13px}textarea{min-height:43px;resize:none}input[type=text],input[type=url],textarea,select{font-size:13px;padding:5px;margin:3px 0 6px}.buttons,#status{display:none}.meta{grid-template-columns:1fr 1fr;gap:20px}section{break-inside:avoid}}</style></head><body><main><p class="hint">資訊科技與應用 · W2 · 自己留一份，依教師當堂指示繳交</p><h1>我存得住，也救得回來</h1><p class="hint">課內先記半成品，未完成欄位寫「W3 前補」。不填個資；內容不會傳送，關頁前請下載或列印。</p><form id="card"><div class="meta"><label>班別<select name="班別"><option value="">請選擇</option><option>AA</option><option>AB</option></select></label><label>今天的路徑<select name="路徑"><option value="">請選擇</option><option>GitHub 網頁</option><option>本機模擬（非 Git commit）</option></select></label></div><section><h2>1. 存得住</h2><label>第一筆 commit／版本：改了什麼、為什麼？<textarea name="版本一" rows="2"></textarea></label><label>第二筆 commit／版本：改了什麼、為什麼？<textarea name="版本二" rows="2"></textarea></label></section><section><h2>2. 看得懂差異</h2><div class="meta"><label>原本那一句<input type="text" name="改前"></label><label>後來那一句<input type="text" name="改後"></label></div></section><section><h2>3. 救得回來</h2><label>我救回哪一版、哪一句？為什麼選它？<textarea name="救回理由" rows="2"></textarea></label><div class="checks"><label><input type="checkbox" name="已打開目前檔案確認">我打開目前檔案確認過</label><label><input type="checkbox" name="已向同學說明差異與救回">我向同學說明了差異與救回</label></div></section><section><h2>4. 網址，或卡關登記</h2><label>公開 Pages 網址（完成再填；不用填私有 repo 網址）<input type="url" name="網站網址"></label><label>卡在哪個步驟？已試過什麼？<textarea name="卡關" rows="2"></textarea></label><p class="hint">本機開啟不等於公開網址。帳號／驗證／Pages 卡關依課程安排在 W3 前補，不因帳號卡關扣分。</p></section><div class="buttons"><button type="button" id="save">下載填寫紀錄</button><button type="button" id="print">列印</button><a href="student.html">回學生步驟</a></div></form><p id="status" role="status" aria-live="polite"></p></main><script>
// Native text controls print only their visible viewport; mirrors retain the whole answer.
const printStyle=document.createElement('style');
printStyle.textContent='.print-value{display:none}@media print{.print-source{display:none!important}.print-value{display:block;white-space:pre-wrap;overflow-wrap:anywhere;border:1px solid #9aa6b0;padding:5px;min-height:36px;margin:3px 0 6px;font-size:13px;line-height:1.55}.print-value.multiline{min-height:43px}section{break-inside:auto}h2{break-after:avoid}}';
document.head.append(printStyle);
const printFields=[...document.querySelectorAll('textarea,input[type=text],input[type=url]')].map(field=>{const mirror=document.createElement('span');mirror.className='print-value'+(field.tagName==='TEXTAREA'?' multiline':'');mirror.setAttribute('aria-hidden','true');field.classList.add('print-source');field.after(mirror);return {field,mirror};});
function syncPrintValues(){for(const {field,mirror} of printFields)mirror.textContent=field.value||'\u00a0';}
document.getElementById('card').addEventListener('input',syncPrintValues);
window.addEventListener('beforeprint',syncPrintValues);
syncPrintValues();
document.getElementById('print').addEventListener('click',()=>{syncPrintValues();window.print();});
document.getElementById('save').addEventListener('click',()=>{const form=document.getElementById('card');const lines=['資訊科技與應用 W2 離堂證據卡',''];for(const field of form.elements){if(!field.name)continue;lines.push(field.name+'：'+(field.type==='checkbox'?(field.checked?'已確認':'尚未確認'):field.value),'');}const blob=new Blob([lines.join('\n')],{type:'text/plain;charset=utf-8'});const a=document.createElement('a');const url=URL.createObjectURL(blob);a.href=url;a.download='W2-我的證據紀錄.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);document.getElementById('status').textContent='已建立文字檔，請到瀏覽器下載清單確認。';});
</script></body></html>
