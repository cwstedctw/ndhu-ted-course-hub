<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>我的學習紀錄</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="wrap">
      <h1>我的學習紀錄</h1>
      <p>登入之後記下今天學了什麼。每個人只看得到自己的紀錄。</p>
    </div>
  </header>

  <main class="wrap">
    <section id="config-warning" class="card warn" hidden>
      <h2>設定還沒完成</h2>
      <p id="config-message"></p>
      <p>打開 <code>config.js</code>，把兩個「貼上…」換成 Supabase 專案的 Project URL 與 publishable key，存檔後重新整理這一頁。</p>
    </section>

    <section id="auth-view" class="card" hidden>
      <h2>登入或註冊</h2>
      <form id="auth-form">
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="email" required>
        <label for="password">練習用密碼（至少 6 個字元；不要沿用其他帳號的密碼）</label>
        <input id="password" type="password" autocomplete="current-password" minlength="6" required>
        <div class="row">
          <button type="submit">登入</button>
          <button type="button" id="sign-up" class="secondary">第一次來：註冊</button>
        </div>
      </form>
    </section>

    <section id="app-view" hidden>
      <div class="card who">
        <p>已登入：<strong id="user-email"></strong></p>
        <button type="button" id="logout" class="secondary">登出</button>
      </div>

      <form id="log-form" class="card">
        <h2>新增一筆</h2>
        <label for="log-date">日期</label>
        <input id="log-date" type="date" required>
        <label for="topic">今天學了什麼</label>
        <input id="topic" type="text" maxlength="200" required placeholder="例如：把網站接上 Supabase 登入">
        <label for="minutes">花了幾分鐘</label>
        <input id="minutes" type="number" min="0" max="1440" step="1" inputmode="numeric" placeholder="例如：45">
        <label for="note">卡在哪裡、下一步想做什麼（可不填）</label>
        <textarea id="note" maxlength="1000" rows="3"></textarea>
        <button type="submit" id="save">存起來</button>
      </form>

      <section class="card">
        <h2>我的紀錄 <span id="log-count" class="muted"></span></h2>
        <ul id="log-list" class="logs"></ul>
      </section>
    </section>

    <p id="status" role="status" aria-live="polite"></p>
  </main>

  <!-- supabase-js 2.118.0（2026-10-15 版），integrity 確保 CDN 給的檔沒被換過 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"
          integrity="sha384-TcHRA3zBbn+Lexh5n+Oil4guNPOS3rjNDpGRAN46u/s/mB2IZ50ceC6TYDU2yvgK"
          crossorigin="anonymous"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
