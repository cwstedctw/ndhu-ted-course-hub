<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>我的學習小站</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f4ed;color:#152e49;font-family:'Segoe UI','Microsoft JhengHei',sans-serif;line-height:1.8}main{max-width:860px;margin:9vh auto;padding:38px}small{letter-spacing:.15em}h1{font-size:clamp(2.2rem,6vw,4.4rem);line-height:1.18;margin:26px 0}p{font-size:1.2rem}section{border-top:3px solid #b66505;margin-top:48px;padding-top:20px}footer{font-size:.9rem;color:#526071;margin-top:45px}</style></head><body><main><small>MY LEARNING SPACE</small><h1>我的學習小站</h1><p>你好，我是「湖邊散步者」。這是一個虛構暱稱，用來練習公開網站。</p><section><h2>這學期想試的事</h2><p>把每週學到的一件事寫清楚，讓下一週的自己找得到。</p><h2>我的興趣</h2><p>閱讀、觀察校園、學會把檔案收好。</p></section><footer>資訊科技與應用 W2 起步範本。這一頁沒有真實個資，你可以保留原樣練習。</footer></main></body></html>
